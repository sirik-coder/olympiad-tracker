name: Olympiad live tracker

# ---------------------------------------------------------------------------
# WHEN THIS RUNS
#
# All times here are UTC, because that is the only clock GitHub understands.
# Samarkand is UTC+5, so 10:15 UTC is the 15:15 local start.
#
# The real round times, read from the Lichess broadcast rather than assumed:
#
#   Round 1   Wed 16 Sep   10:15 UTC
#   Round 2   Thu 17 Sep   10:15 UTC
#   Round 3   Fri 18 Sep   10:15 UTC
#   Round 4   Sat 19 Sep   10:15 UTC
#   Round 5   Sun 20 Sep   10:15 UTC
#   Round 6   Mon 21 Sep   10:15 UTC
#   -------   Tue 22 Sep   rest day, nothing runs
#   Round 7   Wed 23 Sep   10:15 UTC
#   Round 8   Thu 24 Sep   10:15 UTC
#   Round 9   Fri 25 Sep   10:15 UTC
#   Round 10  Sat 26 Sep   10:15 UTC
#   Round 11  Sun 27 Sep   06:15 UTC   <- four hours earlier than the rest
#
# A classical game here can last seven hours, so each window runs from just
# before the round starts until the last game must be over.
# ---------------------------------------------------------------------------

# HOURLY ATTEMPTS, EACH RUNNING UNTIL THE ROUND ENDS
#
# Two earlier designs failed on live rounds, both because GitHub does not start
# scheduled jobs when it says it will.
#
# Every fifteen minutes, polling for thirteen: on 18 September GitHub delivered
# three of thirty-two runs and started one two hours after the window shut.
#
# Two long runs a day: on 19 September the 10:00 run started at 13:45, three
# and three quarter hours late, missing the first half of Round 4. The 15:35
# run then queued behind it and started at 19:15, after the round had finished,
# and watched an empty board for 165 minutes.
#
# So: ask hourly, and let whichever run actually gets a machine cover the rest
# of the day. Each one polls until a fixed wall-clock time rather than for a
# fixed length, so a late start still stops when the chess does. Runs that are
# queued behind it wake up past that time and exit in seconds. A job may not
# exceed six hours, so the hourly crons also provide the handover when a run
# hits that ceiling.
on:
  schedule:
    # Rounds 1-10, hourly through the round. Rest day (22 Sep) skipped.
    - cron: '0 10-16 16-21,23-26 9 *'
    # Round 11 on 27 September starts four hours earlier than the rest.
    - cron: '0 6-12 27 9 *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print alerts instead of sending them to Slack'
        type: boolean
        default: false
      replay:
        description: 'Post a finished round to Slack instead of watching live, e.g. Round 3'
        default: ''
      until:
        description: 'Stop polling at this UTC time (default 18:30)'
        default: ''
      minutes:
        description: 'How long this run should keep polling'
        default: '20'
      sensitivity:
        description: 'How easily a move counts as a blunder'
        type: choice
        options: [loud, balanced, strict]
        default: loud

# One run at a time, and never cancel the one already going. Cancelling would
# kill it before it uploads its record of what has already been alerted, and
# the next run would restore a stale record and post the same moments twice.
# A late run waits its turn instead.
concurrency:
  group: olympiad-tracker
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # GitHub's own ceiling is six hours. Stay under it so the job ends on its
    # own terms and gets to save its state.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          stockfish_path=$(command -v stockfish || echo /usr/games/stockfish)
          echo "STOCKFISH_PATH=$stockfish_path" >> "$GITHUB_ENV"
          echo "Using $stockfish_path"

      # The memory of which moves we have already alerted on. Without this,
      # every run would start from move one and repost everything.
      - name: Restore what we have already seen
        uses: actions/cache/restore@v4
        with:
          path: state
          key: olympiad-state-${{ github.run_id }}
          restore-keys: |
            olympiad-state-

      - name: Watch the games
        env:
          # Never write this into a file or echo it. It is a password.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENSITIVITY: ${{ github.event.inputs.sensitivity || 'loud' }}
          # Player names and captions carry accents and dashes; without this
          # the log mangles them and looks like a bug that is not there.
          PYTHONIOENCODING: utf-8
        run: |
          # Longest a single job may poll for. GitHub's own ceiling is six
          # hours; stop short of it so the job ends on its own terms and gets
          # to save what it has already alerted on.
          minutes="${{ github.event.inputs.minutes }}"
          [ -z "$minutes" ] && minutes=330

          # When the chess is over. Rounds start 10:15 UTC and the longest
          # games run about seven hours; round 11 on the 27th starts at 06:15.
          until_utc=18:30
          case "${{ github.event.schedule }}" in
            "0 6-12 27 9 *") until_utc=14:30 ;;
          esac
          [ -n "${{ github.event.inputs.until }}" ] && until_utc="${{ github.event.inputs.until }}"
          replay="${{ github.event.inputs.replay }}"
          if [ -n "$replay" ]; then
            echo "Replaying $replay into Slack."
            python run.py --replay "$replay" \
              ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
            exit $?
          fi
          echo "Polling until $until_utc UTC, at most $minutes minutes."
          python run.py \
            --minutes "$minutes" \
            --until "$until_utc" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # Runs even if the step above failed, so a crash halfway through a round
      # does not make the next run repost everything it already sent.
      - name: Save what we have seen
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: olympiad-state-${{ github.run_id }}-${{ github.run_attempt }}
