name: Olympiad live tracker

# ---------------------------------------------------------------------------
# WHEN THIS RUNS
#
# All times here are UTC, because that is the only clock GitHub understands.
# Samarkand is UTC+5, so 10:15 UTC is the 15:15 local start.
#
# The real round times, read from the Lichess broadcast rather than assumed:
#
#   Round 1   Wed 16 Sep   10:15 UTC
#   Round 2   Thu 17 Sep   10:15 UTC
#   Round 3   Fri 18 Sep   10:15 UTC
#   Round 4   Sat 19 Sep   10:15 UTC
#   Round 5   Sun 20 Sep   10:15 UTC
#   Round 6   Mon 21 Sep   10:15 UTC
#   -------   Tue 22 Sep   rest day, nothing runs
#   Round 7   Wed 23 Sep   10:15 UTC
#   Round 8   Thu 24 Sep   10:15 UTC
#   Round 9   Fri 25 Sep   10:15 UTC
#   Round 10  Sat 26 Sep   10:15 UTC
#   Round 11  Sun 27 Sep   06:15 UTC   <- four hours earlier than the rest
#
# A classical game here can last seven hours, so each window runs from just
# before the round starts until the last game must be over.
# ---------------------------------------------------------------------------

# TWO LONG RUNS A DAY, NOT THIRTY-TWO SHORT ONES
#
# This started as a run every fifteen minutes, each polling for thirteen. On
# the first live round, 18 September, GitHub delivered three of the thirty-two
# scheduled runs, and started one of those at 19:56 UTC - two hours after the
# window had closed. Eight hours of chess got about forty minutes of watching.
#
# GitHub does not promise to run a scheduled job on time, and drops them
# outright under load. The fewer we ask for, the better the odds each one
# arrives, so the cadence now comes from inside the job: one run starts in the
# morning and polls for five and a half hours, and a second takes over for the
# rest. A job may not exceed six hours, which is the only reason it is two.
on:
  schedule:
    # Rounds 1-10. Morning watcher, then the afternoon one. Rest day skipped.
    - cron: '0 10 16-21,23-26 9 *'
    - cron: '35 15 16-21,23-26 9 *'
    # Round 11 on 27 September starts four hours earlier than the rest.
    - cron: '0 6 27 9 *'
    - cron: '35 11 27 9 *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print alerts instead of sending them to Slack'
        type: boolean
        default: false
      minutes:
        description: 'How long this run should keep polling'
        default: '20'
      sensitivity:
        description: 'How easily a move counts as a blunder'
        type: choice
        options: [loud, balanced, strict]
        default: loud

# One run at a time, and never cancel the one already going. Cancelling would
# kill it before it uploads its record of what has already been alerted, and
# the next run would restore a stale record and post the same moments twice.
# A late run waits its turn instead.
concurrency:
  group: olympiad-tracker
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # GitHub's own ceiling is six hours. Stay under it so the job ends on its
    # own terms and gets to save its state.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          stockfish_path=$(command -v stockfish || echo /usr/games/stockfish)
          echo "STOCKFISH_PATH=$stockfish_path" >> "$GITHUB_ENV"
          echo "Using $stockfish_path"

      # The memory of which moves we have already alerted on. Without this,
      # every run would start from move one and repost everything.
      - name: Restore what we have already seen
        uses: actions/cache/restore@v4
        with:
          path: state
          key: olympiad-state-${{ github.run_id }}
          restore-keys: |
            olympiad-state-

      - name: Watch the games
        env:
          # Never write this into a file or echo it. It is a password.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SENSITIVITY: ${{ github.event.inputs.sensitivity || 'loud' }}
          # Player names and captions carry accents and dashes; without this
          # the log mangles them and looks like a bug that is not there.
          PYTHONIOENCODING: utf-8
        run: |
          minutes="${{ github.event.inputs.minutes }}"
          if [ -z "$minutes" ]; then
            case "${{ github.event.schedule }}" in
              # The morning watcher: 10:00 -> 15:30, or 06:00 -> 11:30 on the
              # last day. Stops before the afternoon one is due.
              "0 10 "*|"0 6 "*) minutes=330 ;;
              # The afternoon watcher, through to the end of the longest games.
              *) minutes=165 ;;
            esac
          fi
          echo "Polling for $minutes minutes."
          python run.py \
            --minutes "$minutes" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # Runs even if the step above failed, so a crash halfway through a round
      # does not make the next run repost everything it already sent.
      - name: Save what we have seen
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: olympiad-state-${{ github.run_id }}-${{ github.run_attempt }}
